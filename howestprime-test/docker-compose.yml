services:
  # Microservice Movies
  movies-db.howestprime.test:
    image: postgres
    env_file:
      - .movies-db.howestprime.test.env
    restart: always
    ports:
      - 40221:5000
    volumes:
      - postgres:/data/postgres
    networks:
      - howestprime-test
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  movies.howestprime.test:
    image: howestprime-movies:latest
    env_file:
      - .movies.howestprime.test.env
    ports:
      - 40220:8000
    networks:
      - howestprime-test
    depends_on:
      messagebroker.howestprime.test:
        condition: service_healthy
      movies-db.howestprime.test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "dotnet --info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Client Backoffice
  client-backoffice.howestprime.test:
    image: howestprime-client-backoffice:latest
    ports:
      - 10210:8080
    networks:
      - howestprime-test 
    depends_on:
      movies.howestprime.test:
        condition: service_healthy

  # Message Broker
  messagebroker.howestprime.test:
    image: cloudamqp/lavinmq
    ports:
      - 40200:5672
      - 40201:15672
    networks:
      - howestprime-test
    healthcheck:
      test: ["CMD-SHELL", "lavinmqctl status | grep -q 'Uptime: ' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s


networks:
  howestprime-test:
    ipam:
      config:
        - subnet: 10.22.0.0/16

volumes:
  postgres: